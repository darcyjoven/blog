name: Sync from Notion

on:
  schedule:
    # GitHub Actions 的 cron 只能按 UTC 触发，没有时区设置选项。
    # 上海 = UTC+8，所以「早8 点到晚 8 点」换算成 UTC 是 0:00-12:00。
    #
    # 错开整点：整点是 GitHub 调度队列高峰，常延迟 10~20 分钟。
    # 用 13/43 分而不是 0/30 分。
    #
    # 与其它保底服务的错开方案（见 create仓库的「定时服务规划.md」）：
    #   GitHub cron  13/43 分  ← 主力
    #   NAS cron     03/33 分    （间隔 10/20 分钟）
    #   cron-job.org 28/58 分    （间隔 15/15 分钟，更均匀）
    - cron: '13,43 0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 输出供 deploy job 使用
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 Notion 同步
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/sync.py

      - name: 提交变更
        id: commit
        run: |
          if [ -z "$(git status --porcelain content/ static/)" ]; then
            echo "无内容变更，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ static/

          # commit message 不能带 [skip ci]，那个标记会抑制所有 workflow
          git commit -m "chore: 同步 Notion 内容"

          # 用默认的 GITHUB_TOKEN 推送（不配 remote URL）。
          #
          # 关键：GITHUB_TOKEN 推送的 commit 会被 GitHub 标记，
          # 从而抑制 deploy.yml 的 push 触发（GitHub 为防 workflow 循环的设计）。
          # 所以 deploy.yml 不会自动运行，需要下面显式调用。
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # 复用 deploy.yml 构建并发布。
  #
  # 为什么显式调用而不是靠 push 自动触发：
  # 上面用 GITHUB_TOKEN 推送已经抑制了 push 触发，这里调用
  # 是唯一且必然的部署入口，避免部署两次。
  #
  # 好处：sync 自带部署能力，不依赖外部触发是否正常，
  # 也不需要额外的 PAT Secret。
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.sync.outputs.sha }}