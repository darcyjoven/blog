name: Sync from Notion

on:
  schedule:
    # GitHub Actions 的 cron 只能按 UTC 触发，没有时区设置选项。
    # 上海 = UTC+8，所以「早8 点到晚 8 点」换算成 UTC 是 0:00-12:00。
    #
    # 错开整点：整点是 GitHub 调度队列高峰，常延迟 10~20 分钟。
    # 用 13/43 分而不是 0/30 分。
    #
    # 与其它保底服务的错开方案（见 create仓库的「定时服务规划.md」）：
    #   GitHub cron  13/43 分  ← 主力
    #   NAS cron     03/33 分    （间隔 10/20 分钟）
    #   cron-job.org 28/58 分    （间隔 15/15 分钟，更均匀）
    - cron: '13,43 0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 Notion 同步
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/sync.py

      - name: 有变更则提交并推送
        run: |
          if [ -z "$(git status --porcelain content/ static/)" ]; then
            echo "无内容变更，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ static/
          # 注意：不要用 [skip ci]。
          # GitHub 的 skip 标记会同时抑制 sync.yml 和 deploy.yml，
          # 结果是内容提交了但站点不部署。
          git commit -m "chore: 同步 Notion 内容"
          git push

# commit push 会自动触发 deploy.yml（Hugo 构建 + Pagefind + 发布），
# 所以这里不再重复构建。转换问题会在 deploy 的日志里暴露。