name: Sync from Notion

on:
  schedule:
    # GitHub Actions 的 cron 只能按 UTC 触发，没有时区设置选项。
    # 上海 = UTC+8，所以「早 8 点到晚 8 点」换算成 UTC 是 0:00-12:00。
    #
    # 实际覆盖：上海时间 08:00 - 19:30，每 30 分钟一次。
    # （UTC 0:00-11:00 的 0 分和 30 分，共 24 次/天）
    #
    # 几点错开的考虑：
    # 1. 用 0/30 而不是 */30，语义更明确
    # 2. 不贴整点（0 分）——整点是 GitHub 调度队列高峰，常延迟 10~20 分钟
    # 3. 夜间不跑：文章通常白天写，夜间同步没有意义
    - cron: '0,30 0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 Notion 同步
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/sync.py

      - name: 有变更则提交并推送
        run: |
          if [ -z "$(git status --porcelain content/ static/)" ]; then
            echo "无内容变更，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ static/
          # 注意：不要用 [skip ci]。
          # GitHub 的 skip 标记会同时抑制 sync.yml 和 deploy.yml，
          # 结果是内容提交了但站点不部署。
          git commit -m "chore: 同步 Notion 内容"
          git push

# commit push 会自动触发 deploy.yml（Hugo 构建 + Pagefind + 发布），
# 所以这里不再重复构建。转换问题会在 deploy 的日志里暴露。