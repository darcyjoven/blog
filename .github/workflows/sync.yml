name: Sync from Notion

on:
  schedule:
    # GitHub Actions 的 cron 只能按 UTC 触发，没有时区设置选项。
    # 上海 = UTC+8，所以「早8 点到晚 8 点」换算成 UTC 是 0:00-12:00。
    #
    # 错开整点：整点是 GitHub 调度队列高峰，常延迟 10~20 分钟。
    # 用 13/43 分而不是 0/30 分。
    #
    # 与其它保底服务的错开方案（见 create仓库的「定时服务规划.md」）：
    #   GitHub cron  13/43 分  ← 主力
    #   NAS cron     03/33 分    （间隔 10/20 分钟）
    #   cron-job.org 28/58 分    （间隔 15/15 分钟，更均匀）
    - cron: '13,43 0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 Notion 同步
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/sync.py

      - name: 有变更则提交并推送
        env:
          # 用 PAT 而不是默认的 GITHUB_TOKEN。
          #
          # 原因：GITHUB_TOKEN 推送的 commit 会被 GitHub 标记，
          # 从而**抑制所有 workflow 的 push 触发**（包括 deploy.yml）——
          # 这是为了防止 workflow 无限循环。
          # 结果就是：内容提交成功，但站点不部署。
          #
          # PAT 需要 Contents: Read and write 权限。
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain content/ static/)" ]; then
            echo "无内容变更，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ static/
          git commit -m "chore: 同步 Notion 内容"

          # 注意：commit message 不能带 [skip ci]，
          # 那个标记同样会抑制 deploy.yml。
          git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/darcyjoven/blog.git" HEAD:main

# push 用的是 PAT 而非 GITHUB_TOKEN，所以会正常触发 deploy.yml
# （Hugo 构建 + Pagefind 索引 + 发布 Pages）。