name: Deploy to GitHub Pages

on:
  # 手动 push 时自动部署
  push:
    branches: [main]
  # 被 sync.yml 复用（Notion 同步后显式调用）
  workflow_call:
    inputs:
      sha:
        description: '要构建的 commit SHA，留空则用触发本次运行的 commit'
        required: false
        type: string
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发发布冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # 被 sync.yml 调用时，github.sha 是 sync 的运行 SHA，
          # 不是它刚提交的那个 commit，所以要用传入的 sha
          ref: ${{ inputs.sha || github.sha }}

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      # mdBook 教程（可选）。
      # 检测到 bdl/src/ 存在才构建，所以 blog-only 的部署不受影响。
      # 以后加 Rust / CGO 等教程，只需再建一个 <name>/ 目录和 book.toml，
      # 这里改成循环即可，不需要动 deploy 逻辑。
      - name: 构建 mdBook 教程（如果有）
        run: |
          found=0
          for dir in bdl rust cgo */; do
            if [ -f "$dir/book.toml" ] && [ -d "$dir/src" ]; then
              name=$(basename "$dir")
              echo ">>> 构建 mdBook: $name"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "未发现 mdBook 项目，跳过"
            exit 0
          fi

          # mdBook 是 Rust 单二进制，直接下载
          MDBOOK_VER=0.4.52
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VER}/mdbook-v${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin/

          for dir in bdl rust cgo */; do
            if [ -f "$dir/book.toml" ] && [ -d "$dir/src" ]; then
              name=$(basename "$dir")
              echo ">>> mdbook build $name"
              mdbook build "$dir"
              # 产物移到 static/<name>/，hugo build 会拷进 public/<name>/
              rm -rf "static/$name"
              mkdir -p "static/$name"
              cp -r "$dir/book/." "static/$name/"
              echo ">>> $name 产物已放入 static/$name/"
            fi
          done

      - name: 配置 Git 身份（Stack 主题需要）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 构建站点
        run: hugo --minify --gc

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成 Pagefind 搜索索引
        run: npx --yes pagefind --site public

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4