name: Deploy to GitHub Pages

on:
  # 手动 push 时自动部署
  push:
    branches: [main]
  # 被 sync.yml 复用（Notion 同步后显式调用）
  workflow_call:
    inputs:
      sha:
        description: '要构建的 commit SHA，留空则用触发本次运行的 commit'
        required: false
        type: string
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发发布冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # 被 sync.yml 调用时，github.sha 是 sync 的运行 SHA，
          # 不是它刚提交的那个 commit，所以要用传入的 sha
          ref: ${{ inputs.sha || github.sha }}

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: 配置 Git 身份（Stack 主题需要）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 构建站点
        run: hugo --minify --gc

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成 Pagefind 搜索索引
        run: npx --yes pagefind --site public

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4