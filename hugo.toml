# Hugo 主配置
# 内容放在 content/post/，由 Notion 同步脚本写入

baseURL               = "https://blog.darven.top/"
title                  = "darcyjoven"
theme                  = "Stack"

# 中文站点：影响 Summary / WordCount，也影响 Pagefind 的分词策略
hasCJKLanguage         = true
defaultContentLanguage = "zh"

enableRobotsTXT        = true

[pagination]
    pagerSize = 10

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[params]
    mainSections   = ["post"]
    rssFullContent = true

    # 侧边栏头像。用 256x256 而非 400x400 原图——侧边栏实际显示约 64px，
# 原图 123KB 每次都要传一遍，缩到 256px（34KB）肉眼无差别。
# 400x400 原图保留在 assets/img/avatar-src.png，需要更大尺寸时用。
    sidebar        = { subtitle = "技术笔记", avatar = "img/avatar-256.png", emoji = "✏️" }

    # favicon 交给 layouts/_partials/head/custom.html 处理。
    # 不设的话 Stack 会输出 <link rel="shortcut icon"> 指向 400x400 原图，
    # 浏览器 tab 图标只需要 32x32，那样太浪费带宽。
    # 各尺寸文件在 static/icons/，构建后位于 /icons/。

    # 评论系统：utterances（评论存 GitHub Issues）
    [params.comments]
        enabled = true
        provider = "utterances"

        [params.comments.utterances]
            # 填 owner/repo，不带 https://
            repo = "darcyjoven/blog"
            # 用页面路径匹配 Issue，不含域名。
            # 好处：将来换域名或改 URL，评论仍能对应到同一篇文章
            issueTerm = "pathname"
            # 评论 Issue 加这个标签，方便在 Issues 列表里筛选
            label = "comment"

[params.article]
    # 全站开启 KaTeX 公式支持（Stack 用 CDN 加载 KaTeX 0.16.9）
    math = true

    [params.article.license]
        enabled = true
        default = ""

[params.widgets]
    homepage = [
        { type = "search" },
        { type = "archives",  params = { limit = 10 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud",  params = { limit = 20 } },
    ]
    page = [{ type = "toc" }]

[params.related]
    threshold    = 80
    includeNewer = false
    toLower      = false

[markup]
    [markup.goldmark.renderer]
        # 允许 Markdown 里内嵌 HTML
        unsafe = true
    [markup.highlight]
        noClasses          = false
        codeFences         = true
        guessSyntax        = true
        lineNos            = true
        lineNumbersInTable = true
        tabWidth           = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel   = 4
        ordered    = true
